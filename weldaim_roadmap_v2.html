<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldAIM — Roadmap Post-Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.12);
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #484f58;
    --teal: #00c9a7;
    --teal-dim: rgba(0,201,167,0.08);
    --blue: #388bfd;
    --blue-dim: rgba(56,139,253,0.08);
    --amber: #d29922;
    --amber-dim: rgba(210,153,34,0.08);
    --purple: #a371f7;
    --purple-dim: rgba(163,113,247,0.08);
    --red: #f85149;
    --red-dim: rgba(248,81,73,0.08);
    --pink: #ec6cb9;
    --pink-dim: rgba(236,108,185,0.08);
    --gray-dim: rgba(139,148,158,0.08);
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .wrap { max-width: 820px; margin: 0 auto; }

  /* HEADER */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 0.5px solid var(--border);
  }
  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--teal);
    text-transform: uppercase;
  }
  .logo span { color: var(--text3); font-weight: 400; }
  .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text3);
  }

  /* SUBHEADER NOTE */
  .subnote {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 1.5rem;
    line-height: 1.6;
    padding: 10px 14px;
    background: var(--bg2);
    border-left: 2px solid var(--text3);
    border-radius: var(--radius-sm);
  }

  /* FILTER BARS */
  .filter-group { margin-bottom: 1rem; }
  .filter-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
    display: block;
  }
  .tag-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: .06em;
    padding: 4px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
  }
  .tag-btn:hover { border-color: var(--teal); color: var(--teal); }
  .tag-btn.active { background: var(--teal-dim); color: var(--teal); border-color: var(--teal); }

  /* INPUT AREA */
  .input-box {
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .input-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .input-row input[type="text"] {
    flex: 1;
    min-width: 160px;
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .input-row input:focus { border-color: var(--teal); }
  .input-row input::placeholder { color: var(--text3); }
  select {
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    outline: none;
    cursor: pointer;
  }
  select option { background: var(--bg3); }
  textarea {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    line-height: 1.6;
    resize: vertical;
    min-height: 60px;
    outline: none;
    transition: border-color .15s;
    margin-bottom: 10px;
  }
  textarea:focus { border-color: var(--teal); }
  textarea::placeholder { color: var(--text3); }

  .btn-add {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 8px 20px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--teal);
    background: var(--teal-dim);
    color: var(--teal);
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
  }
  .btn-add:hover { background: var(--teal); color: #0d1117; }

  /* ITEMS LIST */
  .items-list { display: flex; flex-direction: column; gap: 8px; }

  .item-card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.125rem;
    transition: border-color .15s;
    position: relative;
  }
  .item-card:hover { border-color: var(--border2); }
  .item-card.done { opacity: 0.45; }

  .item-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .item-title {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }
  .item-title.done { text-decoration: line-through; }
  .item-body {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .item-dep {
    font-size: 11.5px;
    color: var(--amber);
    margin-top: 6px;
    display: flex;
    gap: 5px;
    align-items: baseline;
  }
  .item-dep::before { content: "⚠"; font-size: 11px; }

  .item-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .item-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text3);
  }
  .btn-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: .06em;
    padding: 2px 10px;
    border-radius: 10px;
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    text-transform: uppercase;
    margin-left: auto;
  }
  .btn-status:hover { border-color: var(--teal); color: var(--teal); }
  .btn-del {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    line-height: 1;
    transition: color .15s;
    flex-shrink: 0;

  .c-mod1     { background: var(--blue-dim);   color: var(--blue); }

    margin-top: 2.5rem;

    font-size: 10px;

    letter-spacing: .06em;
    padding-top: 1rem;
    border-top: 0.5px solid var(--border);

    font-family: 'IBM Plex Mono', monospace;

    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text3);

  }

</style>
</head>

// Cache locale — usata solo come riserva se il foglio non risponde
function saveCache() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

// Carica i dati dal Google Sheet via JSONP.
// Se il foglio è vuoto e non abbiamo mai fatto il seeding, carichiamo
// i task precompilati (PRELOADED) UNA SOLA VOLTA e li scriviamo sul foglio.
function load() {
  const cbName = 'weldaim_cb_' + Date.now();
  const script = document.createElement('script');

  window[cbName] = function(data) {
    delete window[cbName];
    script.remove();

    if (Array.isArray(data) && data.length > 0) {
      // Il foglio ha già dati: è la fonte di verità
      items = data;
      saveCache();
      render();
    } else if (!localStorage.getItem(SEED_FLAG)) {
      // Foglio vuoto e mai seminato prima: carichiamo i task di partenza
      console.log('[ROADMAP] Foglio vuoto — seeding iniziale dei task precompilati...');
      items = PRELOADED;
      PRELOADED.forEach(item => inviaAlFoglio('add', item));
      localStorage.setItem(SEED_FLAG, 'true');
      saveCache();
      render();
    } else {
      // Foglio vuoto ma già seminato in passato (es. hai cancellato tutto tu): rispettalo
      items = [];
      saveCache();
      render();
    }
  };

  script.onerror = function() {
    console.warn('[ROADMAP] Impossibile contattare il foglio — uso la cache locale');
    delete window[cbName];
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : PRELOADED;
    render();
  };

  script.src = SCRIPT_URL + '?callback=' + cbName;
  document.body.appendChild(script);
}

// Invia una modifica al Google Sheet. no-cors = non possiamo leggere
// la risposta, quindi l'UI viene già aggiornata in locale PRIMA di chiamare questa funzione.
function inviaAlFoglio(action, item) {
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action, ...item })
  }).catch(err => console.warn('[ROADMAP] Sincronizzazione fallita:', err));
}

function addItem() {
  const title = document.getElementById('inp-title').value.trim();
  const body  = document.getElementById('inp-body').value.trim();
  const cat   = document.getElementById('inp-cat').value;
  const priority = document.getElementById('inp-priority').value;
  const dep   = document.getElementById('inp-dep').value.trim();
  if (!title) { document.getElementById('inp-title').focus(); return; }
  const now = new Date();
  const nuovoItem = {
    id: Date.now(),
    title, body, dep, cat, priority,
    status: "Backlog",
    date: now.toLocaleDateString('it-IT', {day:'2-digit',month:'2-digit',year:'2-digit'})
  };
  items.unshift(nuovoItem);
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-body').value  = '';
  document.getElementById('inp-dep').value   = '';
  saveCache();
  render();
  inviaAlFoglio('add', nuovoItem);
}

function deleteItem(id) {
  if (!confirm('Eliminare questo task dalla roadmap?')) return;
  items = items.filter(n => n.id !== id);
  saveCache();
  render();
  inviaAlFoglio('delete', { id });
}

function cycleStatus(id) {
  const order = ['Backlog', 'Pianificato', 'In corso', 'Fatto'];
  const item = items.find(n => n.id === id);
  if (!item) return;
  const idx = order.indexOf(item.status);
  item.status = order[(idx + 1) % order.length];
  saveCache();
  render();
  inviaAlFoglio('update', { id: item.id, status: item.status });
}

function filterCat(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('#tagbar-cat .tag-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function filterStatus(status, btn) {
  activeStatus = status;
  document.querySelectorAll('#tagbar-status .tag-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  let filtered = items;
  if (activeCat !== 'all') filtered = filtered.filter(n => n.cat === activeCat);
  if (activeStatus !== 'all') filtered = filtered.filter(n => n.status === activeStatus);
  filtered = [...filtered].sort((a,b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]);

  document.getElementById('cnt').textContent = items.length + (items.length === 1 ? ' task' : ' task');
  const list = document.getElementById('list');

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><span class="empty-icon">🗺️</span>Nessun task in questa vista</div>`;
    return;
  }

  list.innerHTML = filtered.map(n => `
    <div class="item-card ${n.status === 'Fatto' ? 'done' : ''}" data-cat="${esc(n.cat)}">
      <div class="item-top">
        <div style="flex:1">
          <div class="item-title ${n.status === 'Fatto' ? 'done' : ''}">${esc(n.title)}</div>
          ${n.body ? `<div class="item-body">${esc(n.body)}</div>` : ''}
          ${n.dep ? `<div class="item-dep">${esc(n.dep)}</div>` : ''}
        </div>
        <button class="btn-del" onclick="deleteItem(${n.id})" title="Elimina">✕</button>
      </div>
      <div class="item-meta">
        <span class="badge ${CAT_CLASS[n.cat] || 'c-comm'}">${esc(n.cat)}</span>
        <span class="badge ${PRIORITY_CLASS[n.priority] || 'p-media'}">${esc(n.priority)}</span>
        <span class="item-date">${n.date}</span>
        <button class="btn-status" onclick="cycleStatus(${n.id})">${esc(n.status)}</button>
      </div>
    </div>
  `).join('');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(items, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'weldaim_roadmap_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') addItem();
});

load();
</script>
</body>
</html>
