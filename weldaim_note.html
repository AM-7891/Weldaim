<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldAIM — Note di Progetto</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.12);
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #484f58;
    --teal: #00c9a7;
    --teal-dim: rgba(0,201,167,0.08);
    --blue: #388bfd;
    --blue-dim: rgba(56,139,253,0.08);
    --amber: #d29922;
    --amber-dim: rgba(210,153,34,0.08);
    --purple: #a371f7;
    --purple-dim: rgba(163,113,247,0.08);
    --red: #f85149;
    --red-dim: rgba(248,81,73,0.08);
    --gray-dim: rgba(139,148,158,0.08);
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .wrap { max-width: 780px; margin: 0 auto; }

  /* HEADER */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 0.5px solid var(--border);
  }
  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--teal);
    text-transform: uppercase;
  }
  .logo span { color: var(--text3); font-weight: 400; }
  .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text3);
  }

  /* TAG FILTER */
  .tag-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }
  .tag-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: .06em;
    padding: 4px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
  }
  .tag-btn:hover { border-color: var(--teal); color: var(--teal); }
  .tag-btn.active { background: var(--teal-dim); color: var(--teal); border-color: var(--teal); }

  /* INPUT AREA */
  .input-box {
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .input-row input {
    flex: 1;
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .input-row input:focus { border-color: var(--teal); }
  .input-row input::placeholder { color: var(--text3); }
  select {
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    outline: none;
    cursor: pointer;
  }
  select option { background: var(--bg3); }
  textarea {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    line-height: 1.6;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border-color .15s;
    margin-bottom: 10px;
  }
  textarea:focus { border-color: var(--teal); }
  textarea::placeholder { color: var(--text3); }

  .btn-add {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 8px 20px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--teal);
    background: var(--teal-dim);
    color: var(--teal);
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
  }
  .btn-add:hover { background: var(--teal); color: #0d1117; }

  /* NOTES LIST */
  .notes-list { display: flex; flex-direction: column; gap: 8px; }

  .note-card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.125rem;
    transition: border-color .15s;
    position: relative;
  }
  .note-card:hover { border-color: var(--border2); }

  .note-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .note-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }
  .note-body {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .note-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .note-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .note-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text3);
  }
  .btn-del {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    line-height: 1;
    transition: color .15s;
    flex-shrink: 0;
  }
  .btn-del:hover { color: var(--red); }

  /* TAG COLORS */
  .t-idea     { background: var(--purple-dim); color: var(--purple); }
  .t-feature  { background: var(--blue-dim);   color: var(--blue); }
  .t-arch     { background: var(--teal-dim);   color: var(--teal); }
  .t-comm     { background: var(--amber-dim);  color: var(--amber); }
  .t-bug      { background: var(--red-dim);    color: var(--red); }
  .t-altro    { background: var(--gray-dim);   color: var(--text2); }

  /* LEFT ACCENT per tag */
  .note-card[data-tag="Idea"]          { border-left: 2px solid var(--purple); }
  .note-card[data-tag="Feature"]       { border-left: 2px solid var(--blue); }
  .note-card[data-tag="Architettura"]  { border-left: 2px solid var(--teal); }
  .note-card[data-tag="Commerciale"]   { border-left: 2px solid var(--amber); }
  .note-card[data-tag="Bug/Fix"]       { border-left: 2px solid var(--red); }
  .note-card[data-tag="Altro"]         { border-left: 2px solid var(--text3); }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 3rem 0;
    color: var(--text3);
    font-size: 13px;
  }
  .empty-icon { font-size: 28px; margin-bottom: 8px; display: block; }

  /* FOOTER */
  .footer {
    margin-top: 2.5rem;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: .06em;
    padding-top: 1rem;
    border-top: 0.5px solid var(--border);
  }

  /* EXPORT */
  .btn-export {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: .06em;
    padding: 4px 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
  }
  .btn-export:hover { color: var(--text2); border-color: var(--text2); }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="logo">WeldAIM <span>// Note di Progetto</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn-export" onclick="exportJSON()">↓ Export</button>
      <span class="count" id="cnt">0 note</span>
    </div>
  </div>

  <!-- FILTRI -->
  <div class="tag-bar">
    <button class="tag-btn active" onclick="filterTag('all',this)">Tutte</button>
    <button class="tag-btn" onclick="filterTag('Idea',this)">Idea</button>
    <button class="tag-btn" onclick="filterTag('Feature',this)">Feature</button>
    <button class="tag-btn" onclick="filterTag('Architettura',this)">Architettura</button>
    <button class="tag-btn" onclick="filterTag('Commerciale',this)">Commerciale</button>
    <button class="tag-btn" onclick="filterTag('Bug/Fix',this)">Bug/Fix</button>
    <button class="tag-btn" onclick="filterTag('Altro',this)">Altro</button>
  </div>

  <!-- INPUT -->
  <div class="input-box">
    <div class="input-row">
      <input type="text" id="inp-title" placeholder="Titolo (opzionale)" />
      <select id="inp-tag">
        <option value="Idea">Idea</option>
        <option value="Feature">Feature</option>
        <option value="Architettura">Architettura</option>
        <option value="Commerciale">Commerciale</option>
        <option value="Bug/Fix">Bug/Fix</option>
        <option value="Altro">Altro</option>
      </select>
    </div>
    <textarea id="inp-body" placeholder="Scrivi la nota o spot point..."></textarea>
    <button class="btn-add" onclick="addNote()">+ Aggiungi</button>
  </div>

  <!-- LISTA NOTE -->
  <div class="notes-list" id="list"></div>

  <div class="footer">weldaim.ai &nbsp;·&nbsp; note salvate in localStorage</div>
</div>

<script>
const STORAGE_KEY = 'weldaim_notes_v1';
const TAG_CLASS = {
  'Idea':'t-idea','Feature':'t-feature','Architettura':'t-arch',
  'Commerciale':'t-comm','Bug/Fix':'t-bug','Altro':'t-altro'
};
let notes = [];
let activeFilter = 'all';

const PRELOADED = [
  {
    id: 1746957600004,
    title: "Agente AI lettura disegni tecnici",
    body: "Agente AI per offerte/Riesame tecnico: implementare un Agente AI capace di leggere i disegni tecnici meccanici con saldatura. Fare training con disegni con indicazioni corrette di saldatura e con disegni con indicazioni incorrette.",
    tag: "Architettura",
    date: "11/05/26",
    time: ""
  },
  {
    id: 1746957600003,
    title: "Mock-up: raccolta esempi",
    body: "Chiedere di recuperare le correzioni di Mock-up con errori di compilazione e con macrografie errate (le prime di Forghieri). Chiedere di recuperare mock-up corretti.",
    tag: "Altro",
    date: "11/05/26",
    time: ""
  },
  {
    id: 1746957600002,
    title: "WPS/WPQR/WQ: raccolta esempi",
    body: "Chiedere a Giulio esempi di documenti corretti e documenti strani/anomali.",
    tag: "Altro",
    date: "11/05/26",
    time: ""
  },
  {
    id: 1746957600001,
    title: "Certificati 3.1: esempi giusti e sbagliati",
    body: "Giulio: raccogliere esempi di certificati 3.1 corretti e sbagliati, inclusi quelli in cinese, con e senza DoP e marcatura CE.",
    tag: "Altro",
    date: "11/05/26",
    time: ""
  }
];

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      notes = JSON.parse(raw);
    } else {
      notes = PRELOADED;
      save();
    }
  } catch(e) { notes = PRELOADED; }
  render();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
}

function addNote() {
  const title = document.getElementById('inp-title').value.trim();
  const body  = document.getElementById('inp-body').value.trim();
  const tag   = document.getElementById('inp-tag').value;
  if (!body) { document.getElementById('inp-body').focus(); return; }
  const now = new Date();
  notes.unshift({
    id: Date.now(),
    title, body, tag,
    date: now.toLocaleDateString('it-IT', {day:'2-digit',month:'2-digit',year:'2-digit'}),
    time: now.toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'})
  });
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-body').value  = '';
  save();
  render();
}

function deleteNote(id) {
  if (!confirm('Eliminare questa nota?')) return;
  notes = notes.filter(n => n.id !== id);
  save();
  render();
}

function filterTag(tag, btn) {
  activeFilter = tag;
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const filtered = activeFilter === 'all' ? notes : notes.filter(n => n.tag === activeFilter);
  document.getElementById('cnt').textContent = notes.length + (notes.length === 1 ? ' nota' : ' note');
  const list = document.getElementById('list');

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><span class="empty-icon">📋</span>Nessuna nota${activeFilter !== 'all' ? ' in questa categoria' : ''}</div>`;
    return;
  }

  list.innerHTML = filtered.map(n => `
    <div class="note-card" data-tag="${esc(n.tag)}">
      <div class="note-top">
        <div style="flex:1">
          ${n.title ? `<div class="note-title">${esc(n.title)}</div>` : ''}
          <div class="note-body">${esc(n.body)}</div>
        </div>
        <button class="btn-del" onclick="deleteNote(${n.id})" title="Elimina">✕</button>
      </div>
      <div class="note-meta">
        <span class="note-tag ${TAG_CLASS[n.tag] || 't-altro'}">${esc(n.tag)}</span>
        <span class="note-date">${n.date}${n.time ? ' · ' + n.time : ''}</span>
      </div>
    </div>
  `).join('');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(notes, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'weldaim_note_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

// Shortcut: Ctrl+Enter per aggiungere
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') addNote();
});

load();
</script>
</body>
</html>
